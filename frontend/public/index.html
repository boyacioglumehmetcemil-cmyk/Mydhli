<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#FFCC00" />
        <meta name="description" content="DHL Global Forwarding PNG — Track, ship and document freight worldwide. Real-time ocean freight tracking + customs paperwork management. (Demo build)" />

        <!-- Favicons (browser tab) -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <!-- Apple touch icon kept ONLY as a bookmark thumbnail, not for PWA
             install. Faz 7.9: PWA install role lives at /m/ (Expo Web bundle).
             The web shell at / intentionally exposes NO manifest, NO
             apple-mobile-web-app-* meta, and NO mobile-web-app-capable so
             Add-to-Home-Screen from / cannot pick up the wrong app. -->
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>DHL Global Forwarding — myDHLi</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
